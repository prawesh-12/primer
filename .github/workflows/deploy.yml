# Build the Next.js edition of the primer and publish it to GitHub Pages.
#
# The site is fully prerendered (`output: 'export'`), so what Pages serves is
# plain HTML that Google can crawl without running any JavaScript.
name: Deploy site

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          # Change this if you move the site to a custom domain.
          NEXT_PUBLIC_SITE_URL: https://systemdesignprimer.github.io
        run: npm run build

      - name: Check nothing was lost in the restructure
        working-directory: web
        run: npm run verify

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
